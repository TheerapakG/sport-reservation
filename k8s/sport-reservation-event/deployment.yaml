apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-reservation-event
  labels:
    app: sport-reservation-event
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sport-reservation-event
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: sport-reservation-event
    spec:
      containers:
        - name: sport-reservation-event
          image: <IMAGE>
          ports:
            - containerPort: 3000
              name: sp-event-svc
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: sport-reservation-event-secret
                  key: postgresUrl
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sport-reservation-event-secret
                  key: oauthClientId
            - name: OAUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: sport-reservation-event-secret
                  key: oauthIssuer
            - name: UPLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: sport-reservation-event-secret
                  key: uploadSecret
            - name: UPLOAD_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: sport-reservation-event-secret
                  key: uploadBaseUrl
            - name: USER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sport-reservation-event-secret
                  key: userSecret
---
apiVersion: v1
kind: Service
metadata:
  name: sport-reservation-event-service
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: sp-event-svc
  selector:
    app: sport-reservation-event
